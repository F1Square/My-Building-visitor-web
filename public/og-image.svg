<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#3B5FC0"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="180" fill="#fff" fill-opacity="0.06"/>
  <circle cx="1050" cy="520" r="220" fill="#fff" fill-opacity="0.05"/>

  <!-- Phone mockup -->
  <g filter="url(#shadow)" transform="translate(780 95)">
    <rect x="0" y="0" width="280" height="440" rx="36" fill="#111827"/>
    <rect x="12" y="12" width="256" height="416" rx="28" fill="#F8FAFC"/>
    <rect x="90" y="20" width="100" height="18" rx="9" fill="#111827"/>
    <rect x="36" y="56" width="208" height="48" rx="12" fill="#3B5FC0" fill-opacity="0.12"/>
    <rect x="36" y="120" width="96" height="72" rx="12" fill="#3B5FC0" fill-opacity="0.15"/>
    <rect x="148" y="120" width="96" height="72" rx="12" fill="#0D9488" fill-opacity="0.15"/>
    <rect x="36" y="208" width="208" height="56" rx="12" fill="#E2E8F0"/>
    <rect x="36" y="280" width="208" height="56" rx="12" fill="#E2E8F0"/>
    <rect x="36" y="352" width="208" height="48" rx="12" fill="#3B5FC0"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(96 120)">
    <rect width="72" height="72" rx="18" fill="#fff" fill-opacity="0.15"/>
    <path d="M20 58V28l16-12 16 12v30H20z" fill="#fff" fill-opacity="0.2"/>
    <rect x="26" y="34" width="8" height="8" rx="2" fill="#fff"/>
    <rect x="42" y="34" width="8" height="8" rx="2" fill="#fff"/>
    <rect x="34" y="46" width="8" height="12" rx="2" fill="#fff"/>
    <path d="M16 29l20-16 20 16" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="96" y="250" fill="url(#title)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800">MyBuilding</text>
  <text x="96" y="310" fill="#E0E7FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="600">Smart Society Management App</text>
  <text x="96" y="380" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">Maintenance · Visitors · Complaints · Announcements</text>

  <rect x="96" y="430" width="320" height="52" rx="26" fill="#fff" fill-opacity="0.14"/>
  <text x="126" y="463" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="600">500+ societies · Free 14-day trial</text>
</svg>
